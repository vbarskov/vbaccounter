# DSH-слой VB Accounter: одна строка на навыки.
#
# `name` — имя этого пакета: профиль DSH разрешает его из
# `~/.dsh/profiles/<профиль>/node_modules` после
# `dsh plugin --profile <профиль> add link:<репозиторий>`.
#
# MCP-сервер в этой строке не настраивается: его путь зависит от машины,
# поэтому он добавляется отдельно командой `node dsh/install-mcp.mjs`.
- insert:
    - id: vbaccounter
      name: vbaccounter
